name: Deploy MO Fitness

on:
  push:
    branches: [main]
    paths:
      - 'mo-fitness/**'
      - '.github/workflows/deploy-mo-fitness.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./mo-fitness
      - id: deployment
        uses: actions/deploy-pages@v4
