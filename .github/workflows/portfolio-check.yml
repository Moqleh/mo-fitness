name: Fitness quality check
on:
  push:
    branches: [main]
    paths:
      - 'mo-fitness/**'
      - '.github/workflows/portfolio-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify deployed fitness artifact
        run: |
          set -euo pipefail
          grep -q '<title>MO Fitness' mo-fitness/index.html
          grep -q 'https://moqleh.github.io/mo-fitness/' mo-fitness/index.html
          grep -q 'ai-chat.js' mo-fitness/index.html
          grep -q 'exercise-guide.js' mo-fitness/index.html
          grep -q '<loc>https://moqleh.github.io/mo-fitness/</loc>' mo-fitness/sitemap.xml
          test -f mo-fitness/7f8e2d9c4a6b1e3f5d7c9a2b4e6f8d1c.txt
          grep -q 'Sitemap: https://moqleh.github.io/mo-fitness/sitemap.xml' mo-fitness/robots.txt
