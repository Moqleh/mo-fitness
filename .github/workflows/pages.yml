name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify SEO source files
        run: |
          test -s sitemap.xml
          test -s robots.txt
          grep -Fq '<urlset' sitemap.xml
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published sitemap
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: curl --fail --silent --show-error --location --retry 8 --output /tmp/sitemap.xml "${SITE_URL%/}/sitemap.xml"
          grep -Fq '<urlset' /tmp/sitemap.xml